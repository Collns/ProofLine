<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ProofLine</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0B1F3A;
        background: #FFFFFF;
      }
      .wrap { padding: 16px 20px; }
      .wordmark {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0B1F3A;
      }
      .status {
        margin-top: 14px;
        padding: 10px 12px;
        background: #F3F4F6;
        border-left: 3px solid #9CA3AF;
        font-size: 13px;
        color: #374151;
      }
      .connect {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 10px 12px;
        background: #0D6EFD;
        color: #FFFFFF;
        border: none;
        border-radius: 4px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .connect:hover { background: #0B5ED7; }
      .footer {
        margin-top: 16px;
        font-size: 11px;
        color: #6B7280;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="wordmark">ProofLine</div>
      <div class="status" id="status">Not connected</div>
      <button class="connect" id="connect">Connect to ProofLine</button>
      <div class="footer">
        v<span id="version">0.0.0</span>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
